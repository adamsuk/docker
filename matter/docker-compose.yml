services:
  matter:
    container_name: matter
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    restart: unless-stopped
    # Network mode 'host' is highly recommended for mDNS discovery
    network_mode: host
    volumes:
      - ./data:/data
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=Europe/London
