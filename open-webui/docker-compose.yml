services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    volumes:
      - ./open-webui:/app/backend/data
    ports:
      - 8089:8080
    environment:
      # Setting config
      - WEBUI_URL=https://open-webui.sradams.co.uk
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # Note: Model provider connections & default models are managed via DB (Admin UI).
      # ConfigVar env vars (OPENAI_API_BASE_URLS, OPENAI_API_KEYS, DEFAULT_MODELS, etc.)
      # are ignored after first startup - use Admin Settings to manage connections.
      # Current connections: OpenAI, DeepSeek, OpenCode Go (qwen3.7-plus, kimi-k2.6, glm-5.1, deepseek-v4-pro)
    restart: unless-stopped
    networks:
      - openui-docker

  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo
    ports:
      - 8088:8000
    volumes:
      - ./mcpo-config.json:/app/config/config.json:ro
      - /backup/:/backup/:ro
      - /media/big_boi/:/media/big_boi/:rw
      - /media/small_boi/:/media/small_boi/:rw
      - /media/full_boi/:/media/full_boi/:rw
      - /media/server/:/media/server/:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/:/usr/bin/host:ro
    command: mcpo --config /app/config/config.json --api-key  "${MCPO_API_KEY}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - openui-docker

networks:
  openui-docker:
    external: false
